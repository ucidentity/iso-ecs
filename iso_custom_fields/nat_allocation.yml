---
- name: nat_allocation
  title: nat_allocation
  group: 2
  short: nat_allocation
  description: |
    Fields for logs NOC NAT Pool Allocation
  type: group
  fields:

# Cloudwatch fields
    - name: blocks.max
      level: extended
      type: unsigned_long
      description: Max number of NAT pool blocks

    - name: blocks.used
      level: extended
      type: unsigned_long
      description: Current number of NAT pool blocks used

    - name: pool
      level: extended
      type: keyword
      description: Nat allocation pool

    - name: port.high
      level: extended
      type: unsigned_long
      description: High port in allocated block

    - name: port.low
      level: extended
      type: unsigned_long
      description: Low port in allocated block

    - name: session_id
      level: extended
      type: keyword
      description: session id 

