- name: hashicorp_vault
  type: group
  title: hashicorp vault audit logs
  short: hashicorp vault audit logs
  description: hashicorp vault audit logs
  group: 2
  fields:
  - name: audit.auth.accessor
    level: extended
    type: keyword
    short: ''
    description: This is an HMAC of the client token accessor
  - name: audit.auth.client_token
    level: extended
    type: keyword
    short: ''
    description: This is an HMAC of the client's token ID.
  - name: audit.auth.display_name
    level: extended
    type: keyword
    short: ''
    description: Display name is a non-security sensitive identifier that is applicable
      to this auth. It is used for logging and prefixing of dynamic secrets. For example,
      it may be "armon" for the github credential backend. If the client token is
      used to generate a SQL credential, the user may be "github-armon-uuid". This
      is to help identify the source without using audit tables.
  - name: audit.auth.entity_id
    level: extended
    type: keyword
    short: ''
    description: Entity ID is the identifier of the entity in identity store to which
      the identity of the authenticating client belongs to.
  - name: audit.auth.external_namespace_policies
    level: extended
    type: flattened
    short: ''
    description: External namespace policies represent the policies authorized from
      different namespaces indexed by respective namespace identifiers.
  - name: audit.auth.identity_policies
    level: extended
    type: keyword
    short: ''
    description: These are the policies sourced from the identity.
  - name: audit.auth.metadata
    level: extended
    type: flattened
    short: ''
    description: This will contain a list of metadata key/value pairs associated with
      the authenticated user.
  - name: audit.auth.no_default_policy
    level: extended
    type: boolean
    short: ''
    description: Indicates that the default policy should not be added by core when
      creating a token. The default policy will still be added if it's explicitly
      defined.
  - name: audit.auth.policies
    level: extended
    type: keyword
    short: ''
    description: Policies is the list of policies that the authenticated user is associated
      with.
  - name: audit.auth.policy_results.allowed
    level: extended
    type: boolean
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.name
    level: extended
    type: keyword
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.namespace_id
    level: extended
    type: keyword
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.type
    level: extended
    type: keyword
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.remaining_uses
    level: extended
    type: long
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.token_issue_time
    level: extended
    type: date
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.token_policies
    level: extended
    type: keyword
    short: ''
    description: These are the policies sourced from the token.
  - name: audit.auth.policy_results.granting_policies.token_ttl
    level: extended
    type: long
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.token_type
    level: extended
    type: keyword
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.entity_created
    level: extended
    type: boolean
    short: ''
    description: entity_created is set to true if an entity is created as part of
      a login request.
  - name: audit.auth.policy_results.granting_policies.error
    level: extended
    type: keyword
    short: ''
    description: If an error occurred with the request, the error message is included
      in this field's value.
  - name: audit.auth.policy_results.granting_policies.request.client_certificate_serial_number
    level: extended
    type: keyword
    short: ''
    description: Serial number from the client's certificate.
  - name: audit.auth.policy_results.granting_policies.request.client_id
    level: extended
    type: keyword
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.request.client_token
    level: extended
    type: keyword
    short: ''
    description: This is an HMAC of the client's token ID.
  - name: audit.auth.policy_results.granting_policies.request.client_token_accessor
    level: extended
    type: keyword
    short: ''
    description: This is an HMAC of the client token accessor.
  - name: audit.auth.policy_results.granting_policies.request.data
    level: extended
    type: flattened
    short: ''
    description: The data object will contain secret data in key/value pairs.
  - name: audit.auth.policy_results.granting_policies.request.headers
    level: extended
    type: flattened
    short: ''
    description: Additional HTTP headers specified by the client as part of the request.
  - name: audit.auth.policy_results.granting_policies.request.id
    level: extended
    type: keyword
    short: ''
    description: This is the unique request identifier.
  - name: audit.auth.policy_results.granting_policies.request.mount_accessor
    level: extended
    type: keyword
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.request.mount_type
    level: extended
    type: keyword
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.request.namespace.id
    level: extended
    type: keyword
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.request.namespace.path
    level: extended
    type: keyword
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.request.operation
    level: extended
    type: keyword
    short: ''
    description: 'This is the type of operation which corresponds to path capabilities
      and is expected to be one of: create, read, update, delete, or list.'
  - name: audit.auth.policy_results.granting_policies.request.path
    level: extended
    type: keyword
    short: ''
    description: The requested Vault path for operation.
  - name: audit.auth.policy_results.granting_policies.request.policy_override
    level: extended
    type: boolean
    short: ''
    description: Policy override indicates that the requestor wishes to override soft-mandatory
      Sentinel policies.
  - name: audit.auth.policy_results.granting_policies.request.remote_address
    level: extended
    type: ip
    short: ''
    description: The IP address of the client making the request.
  - name: audit.auth.policy_results.granting_policies.request.remote_port
    level: extended
    type: long
    short: ''
    description: The remote port of the client making the request.
  - name: audit.auth.policy_results.granting_policies.request.replication_cluster
    level: extended
    type: keyword
    short: ''
    description: Name given to the replication secondary where this request originated.
  - name: audit.auth.policy_results.granting_policies.request.wrap_ttl
    level: extended
    type: long
    short: ''
    description: If the token is wrapped, this displays configured wrapped TTL in
      seconds.
  - name: audit.auth.policy_results.granting_policies.request.response.auth.accessor
    level: extended
    type: keyword
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.request.response.auth.client_token
    level: extended
    type: keyword
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.request.response.auth.display_name
    level: extended
    type: keyword
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.request.response.auth.entity_id
    level: extended
    type: keyword
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.request.response.auth.external_namespace_policies
    level: extended
    type: flattened
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.request.response.auth.identity_policies
    level: extended
    type: keyword
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.request.response.auth.metadata
    level: extended
    type: flattened
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.request.response.auth.no_default_policy
    level: extended
    type: boolean
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.request.response.auth.num_uses
    level: extended
    type: long
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.request.response.auth.policies
    level: extended
    type: keyword
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.request.response.auth.token_issue_time
    level: extended
    type: date
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.request.response.auth.token_policies
    level: extended
    type: keyword
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.request.response.auth.token_ttl
    level: extended
    type: long
    short: ''
    description: Time to live for the token in seconds.
  - name: audit.auth.policy_results.granting_policies.request.response.auth.token_type
    level: extended
    type: keyword
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.request.response.auth.data
    level: extended
    type: flattened
    short: ''
    description: Response payload.
  - name: audit.auth.policy_results.granting_policies.request.response.auth.headers
    level: extended
    type: flattened
    short: ''
    description: Headers will contain the http headers from the plugin that it wishes
      to have as part of the output.
  - name: audit.auth.policy_results.granting_policies.request.response.auth.mount_accessor
    level: extended
    type: keyword
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.request.response.auth.mount_type
    level: extended
    type: keyword
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.request.response.auth.redirect
    level: extended
    type: keyword
    short: ''
    description: Redirect is an HTTP URL to redirect to for further authentication.
      This is only valid for credential backends. This will be blanked for any logical
      backend and ignored.
  - name: audit.auth.policy_results.granting_policies.request.response.auth.warnings
    level: extended
    type: keyword
    short: ''
    description: ''
  - name: audit.auth.policy_results.granting_policies.request.response.auth.wrap_info.accessor
    level: extended
    type: keyword
    short: ''
