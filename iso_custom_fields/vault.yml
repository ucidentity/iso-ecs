  - name: audit.auth.policy_results.granting_policies.request.response.auth.wrap_info.creation_time
    level: extended
    type: date
    short: ''
    description: The creation time. This can be used with the TTL to figure out an
      expected expiration.
  - name: audit.auth.policy_results.granting_policies.request.response.auth.wrap_info.token
