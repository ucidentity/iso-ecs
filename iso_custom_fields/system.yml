# Copied from https://github.com/elastic/integrations/blob/main/packages/system/data_stream/auth/fields/fields.yml

- name: system
  type: group
  group: 2
  title: System fields, often from syslog
  description: Fields for system logs, like sshd, sudo
  fields:
    - name: auth.ssh.method
      type: keyword
      level: extended
      description: |
        The SSH authentication method. Can be one of "password" or "publickey".
    - name: auth.ssh.signature
      type: keyword
      level: extended
      description: |
        The signature of the client public key.
    - name: auth.ssh.dropped_ip
      type: ip
      level: extended
      description: |
        The client IP from SSH connections that are open and immediately dropped.
    - name: auth.ssh.event
      type: keyword
      level: extended
      description: |
        The SSH event as found in the logs (Accepted, Invalid, Failed, etc.)

    - name: auth.sudo.error
      type: keyword
      level: extended
      description: |
        The error message in case the sudo command failed.
    - name: auth.sudo.tty
      type: keyword
      level: extended
      description: |
        The TTY where the sudo command is executed.
    - name: auth.sudo.pwd
      type: keyword
      level: extended
      description: |
        The current directory where the sudo command is executed.
    - name: auth.sudo.user
      type: keyword
      level: extended
      description: |
        The target user to which the sudo command is switching.
    - name: auth.sudo.command
      type: keyword
      level: extended
      description: |
        The command executed via sudo.
