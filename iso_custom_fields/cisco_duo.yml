---
# Copied from https://raw.githubusercontent.com/elastic/integrations/main/packages/cisco_duo/data_stream/auth/fields/fields.yml

- name: cisco_duo
  title: cisco_duo
  group: 2
  description: |
    Fields for Cisco Duo logs
  type: group
  fields:

    - name: auth.email
      level: extended
      type: keyword
      description: |
        The email address of the user, if known to Duo, otherwise none.

    - name: auth.event_type
      level: extended
      type: keyword
      description: |
        The type of activity logged.

    - name: auth.factor
      level: extended
      type: keyword
      description: |
        The authentication factor.

    - name: auth.ood_software
      level: extended
      type: keyword
      description: |
        If authentication was denied due to out-of-date software, shows the name of the software.

    - name: auth.reason
      level: extended
      type: keyword
      description: |
        Provide the reason for the authentication attempt result.

    - name: auth.result
      level: extended
      type: keyword
      description: |
        The result of the authentication attempt.

    - name: auth.trusted_endpoint_status
      level: extended
      type: keyword
      description: |
        Status of Trusted Endpoint.

    - name: auth.txid
      level: extended
      type: keyword
      description: |
        The transaction ID of the event.

    - name: auth.alias
      level: extended
      type: keyword
      description: |
        The username alias used to log in.

    - name: auth.access_device.flash_version
      level: extended
      type: keyword
      description: |
        The Flash plugin version used, if present.

    - name: auth.access_device.hostname
      level: extended
      type: keyword
      description: |
        The hostname, if present.

    - name: auth.access_device.ip
      level: extended
      type: ip
      description: |
        The access device's IP address.

    - name: auth.access_device.is_encryption_enabled
      level: extended
      type: keyword
      description: |
        Reports the disk encryption state as detected by the Duo Device Health app.

    - name: auth.access_device.is_firewall_enabled
      level: extended
      type: keyword
      description: |
        Reports the firewall state as detected by the Duo Device Health app.

    - name: auth.access_device.is_password_set
      level: extended
      type: keyword
      description: |
        Reports the system password state as detected by the Duo Device Health app

    - name: auth.access_device.java_version
      level: extended
      type: keyword
      description: |
        The Java plugin version used.

    - name: auth.access_device.location.city
      level: extended
      type: keyword
      description: |
        The city name of the access device using geoip location.

    - name: auth.access_device.location.country
      level: extended
      type: keyword
      description: |
        The country of the access device using geoip location.

    - name: auth.access_device.location.state
      level: extended
      type: keyword
      description: |
        The state name of the access device using geoip location.

    - name: auth.access_device.security_agents
      level: extended
      type: keyword
      description: |
        Reports the security agents present on the endpoint as detected by the Duo Device Health app.

    - name: auth.application.key
      level: extended
      type: keyword
      description: |
        The application's integration_key.

    - name: auth.application.name
      level: extended
      type: keyword
      description: |
        The application's name.

    - name: auth.auth_device.ip
      level: extended
      type: ip
      description: |
        The IP address of the authentication device.

    - name: auth.auth_device.location.city
      level: extended
      type: keyword
      description: |
        The city name of the authentication device using geoip location.

    - name: auth.auth_device.location.country
      level: extended
      type: keyword
      description: |
        The country of the authentication device using geoip location.

    - name: auth.auth_device.location.state
      level: extended
      type: keyword
      description: |
        The state name of the authentication device using geoip location.

    - name: auth.auth_device.as.number
      level: extended
      type: long
      short: auth_device AS Number
      description: |
        Unique number allocated to the autonomous system. The autonomous system number (ASN) uniquely identifies each network on the Internet.

    - name: auth.auth_device.as.organization.name
      level: extended
      type: keyword
      description: Organization name.

    - name: auth.auth_device.geo.city_name
      level: extended
      type: keyword
      description: City name.

    - name: auth.auth_device.geo.continent_name
      level: extended
      type: keyword
      description: Name of the continent.

    - name: auth.auth_device.geo.country_iso_code
      level: extended
      type: keyword
      description: Country ISO code.

    - name: auth.auth_device.geo.country_name
      level: extended
      type: keyword
      description: Country name.

    - name: auth.auth_device.geo.location
      type: geo_point
      level: core
      description: Longitude and latitude.

    - name: auth.auth_device.geo.region_iso_code
      level: extended
      type: keyword
      description: Region ISO code.

    - name: auth.auth_device.geo.region_name
      level: extended
      type: keyword
      description: Region name.

    - name: auth.auth_device.name
      level: extended
      type: keyword
      description: |
        The name of the authentication device.

    - name: admin.action
      level: extended
      type: keyword
      description: |
        The type of change that was performed
    - name: admin.action_performed_on
      level: extended
      type: keyword
      description: |
        The object that was acted on.
    - name: admin.user.name
      level: extended
      type: keyword
      description: |
        The full name of the administrator who performed the action in the Duo Admin Panel.

    # - name: admin.flattened
    #   level: extended
    #   type: flattened
    #   description: |
    #     ES flattened datatype for objects where the subfields aren't known in advance.