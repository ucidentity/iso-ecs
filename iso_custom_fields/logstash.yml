- name: logstash
  title: Logstash
  group: 2
  short: Logstash Logs
  description: >
    Fields from Logstash logs
  type: group
  fields:

    - name: log.module
      level: extended
      type: keyword
      description: >
        The module or class where the event originate.

    - name: log.pipeline_id
      level: extended
      type: keyword
      description: >
        ID of logstash pipeline that generated the log

    - name: log.pipeline_action_id
      level: extended
      type: keyword
      description: >
        ID of specific aciton within a pipeline that generated the log
  
